experiment: ffs_omega_tsr_spatial_x2_v3
defaults_from: configs/mvp_x2_v2.yaml

# Calibration-aware v3 is a separate checkpoint/cache lineage.  The sidecar
# path must be supplied explicitly by the formal training/evaluation command.
data:
  calibration_sidecar_path: null
  derived_contract: calibrated_stereo_v2

calibration_conditioning_v3:
  enabled: true
  protocol_version: dense_rays_factorized_pose_v3
  use_rays: true
  use_stereo_pose: true
  use_temporal_pose: true

# V3.1 keeps metric ownership at the actual LR FFS observation centres.  It
# does not promote bilinear HR interpolation to a frozen measurement field.
measurement_ownership_v3_1:
  enabled: true
  protocol_version: lr_center_projection_bounded_subpixel_v3_1
  minimum_subpixel_residual_hr_px: 1.0
  maximum_subpixel_residual_hr_px: 8.0
  boundary_relative_scale: 0.10

train:
  micro_batch_size: 4
  grad_accumulation: 2
  effective_batch_size: 8
  compile_model: false
