experiment: ffs_omega_tsr_temporal_x2_v2
defaults_from: configs/mvp_x2_v2.yaml

data:
  sequence_length: 3
  vggt_context_pairs: 5

model:
  use_history: true
  use_vggt_pose: true
  use_registers_in_model: false
  epipolar_refinement: false

train:
  stage: temporal
  steps: 15000
  init_from_stage: spatial
  history_detach: true
  compile_model: false

eval:
  temporal_flicker_video: false
  temporal_flicker_video_fps: 5
  temporal_flicker_disparity_range_hr_px: [0.0, 384.0]
  temporal_flicker_error_range_hr_px: [0.0, 20.0]
  temporal_flicker_uncertainty_range: [0.0, 10.0]
  failure_samples_per_criterion: 0
  failure_samples_cpu_limit_bytes: 536870912
