experiment: spring_corrected_S2_t3_k2_control
seed: 42
arm: S2
defaults_from: configs/ablations/temporal_x2_v2_strict_bilinear_gt_no_depth.yaml

# K=2 is the smallest valid V2 candidate set.  It gives a matched lower-K
# control against S3's K=4 path without forking the model state dictionary.
temporal_history_v2:
  top_k: 2

train:
  stage: temporal
  steps: 15000
  micro_batch_size: 1
  grad_accumulation: 1
  effective_batch_size: 1
  num_workers: 0
  persistent_workers: false
