experiment: spring_corrected_S1_t1_spatial_tsr
seed: 42
arm: S1
defaults_from: configs/ablations/v2_strict_bilinear.yaml

data:
  temporal_pose_source: gt

model:
  # Stage A has no VGGT-derived input; keep the control label explicit so
  # reports cannot mistake S1 for the S4 depth-prior arm.
  use_vggt_depth: false

train:
  stage: spatial
  steps_spatial: 5000
  micro_batch_size: 1
  grad_accumulation: 1
  effective_batch_size: 1
  num_workers: 0
  persistent_workers: false
