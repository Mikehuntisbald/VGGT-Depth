experiment: spring_v3_1_F6_half_ffs_t3_vggt_pose_depth
seed: 42
arm: F6
defaults_from: configs/temporal_x2_v3_1.yaml

data:
  source_dataset: Spring-v2
  temporal_pose_source: vggt
  require_cache_inventory_lineage: true

supervision:
  enabled: true
  protocol_version: spring_v2_real_disparity_ground_truth_v1
  target_type: spring_v2_disp1_ground_truth
  teacher_cache_component: spring-ground-truth
  paper_ground_truth: true
  synthetic_ground_truth: true

calibration_conditioning_v3:
  use_rays: true
  use_stereo_pose: true
  use_temporal_pose: true

model:
  use_vggt_pose: true
  use_vggt_depth: true

train:
  stage: temporal
  steps: 15000
