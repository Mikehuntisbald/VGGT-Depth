experiment: ffs_omega_tsr_temporal_x2
defaults_from: configs/mvp_x2.yaml
data:
  scale: 2
  hr_crop: [384, 768]
  sequence_length: 3
  vggt_context_pairs: 5
  crop_origin_multiple: 2
  cache_dtype: float16
model:
  use_history: true
  use_vggt_pose: true
  use_registers_in_model: false
  epipolar_refinement: false
train:
  stage: temporal
  steps: 15000
  init_from_stage: spatial
  compile_model: false

# Non-metric, opt-in evaluation artifact.  The evaluator streams CPU uint8
# panels to imageio/FFmpeg; missing encoder support is reported as NOT_AVAILABLE.
eval:
  temporal_flicker_video: false
  temporal_flicker_video_fps: 5
  temporal_flicker_disparity_range_hr_px: [0.0, 384.0]
  temporal_flicker_error_range_hr_px: [0.0, 20.0]
  temporal_flicker_uncertainty_range: [0.0, 10.0]
