[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffs-omega-tsr"
version = "0.0.1"
description = "Causal disparity super-resolution from frozen Fast-FoundationStereo and VGGT-Omega caches"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy<2",
  "omegaconf>=2.3",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
video = ["imageio>=2.34", "imageio-ffmpeg>=0.5"]
spring = ["h5py>=3.10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [".", "src"]
